[project]
name = "home-automator"
version = "1.0.0"
description = "Home automation as data: devices, groups and rules as JSON documents"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiomqtt==2.5.1",
    "astral==3.2",
    "fastapi==0.143.0",
    "pydantic>=2.0,<3.0",
    "uvicorn==0.54.0",
]

[project.scripts]
automator = "automator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automator"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
