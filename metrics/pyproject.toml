[project]
name = "home-metrics"
version = "1.0.0"
description = "Metrics scraper pushing to VictoriaMetrics"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10.0",
    "aiomqtt>=2.3.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "skodaconnect==1.3.11",
]

[project.scripts]
homemetrics = "homemetrics.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homemetrics"]
