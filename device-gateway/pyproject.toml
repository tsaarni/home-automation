[project]
name = "home-device-gateway"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = ["aiomqtt==2.5.1", "httpx>=0.28,<1", "pydantic>=2,<3", "PyYAML>=6,<7"]
[project.scripts]
device-gateway = "device_gateway.__main__:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/device_gateway"]
[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
