# Sample inventory. Replace the example addresses and device IDs before running.
mqtt:
  host: mosquitto
  port: 1883
  topic_prefix: home/device-gateway
defaults:
  shelly_poll_interval: 15s
  http_timeout: 5s
  command_ttl: 30s
accounts:
  melcloud-main:
    username_env: MELCLOUD_USERNAME
    password_env: MELCLOUD_PASSWORD
devices:
  example-plug:
    adapter: shelly-rpc
    name: Example plug
    url: http://192.0.2.10
    expected_device_id: shellyplugsg3-000000000000 # Replace with Shelly.GetDeviceInfo's id.
  example-heatpump:
    adapter: melcloud-ata
    name: Example heat pump
    account: melcloud-main
    device_id: 123456 # Replace with the ID from User/ListDevices.
    poll_interval: 5m
    followup_interval: 60s
    result_timeout: 5m
