[project]
name = "home-automator"
version = "2.0.0"
description = "Home automation as data: devices, groups and rules as JSON documents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt==2.5.0",
    "astral==3.2",
    "fastapi==0.128.0",
    "pydantic>=2.0,<3.0",
    "uvicorn==0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automator"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
